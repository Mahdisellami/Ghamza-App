services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ghamza_db
    environment:
      POSTGRES_USER: ghamza_user
      POSTGRES_PASSWORD: ghamza_password
      POSTGRES_DB: ghamza_shop
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghamza_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ghamza_network

  # pgAdmin - Database Management UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ghamza_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ghamza.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      - postgres
    networks:
      - ghamza_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ghamza_backend
    environment:
      DATABASE_URL: postgresql://ghamza_user:ghamza_password@postgres:5432/ghamza_shop
      DEBUG: "True"
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ghamza_network
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: ghamza_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ghamza_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  ghamza_network:
    driver: bridge
