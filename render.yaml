databases:
  - name: ghamza-db
    plan: free
    region: frankfurt
    databaseName: ghamza_shop
    user: ghamza_user

services:
  - type: web
    name: ghamza-api
    runtime: python
    region: frankfurt
    plan: free
    rootDirectory: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ghamza-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: ALLOWED_ORIGINS
        value: https://your-vercel-app.vercel.app,http://localhost:3000
      - key: DEBUG
        value: false
