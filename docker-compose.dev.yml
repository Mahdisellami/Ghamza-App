# Development docker-compose with hot reload

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ghamza_db_dev
    environment:
      POSTGRES_USER: ghamza_user
      POSTGRES_PASSWORD: ghamza_password
      POSTGRES_DB: ghamza_shop
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghamza_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ghamza_network

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ghamza_pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ghamza.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      - postgres
    networks:
      - ghamza_network

  # FastAPI Backend (Development mode with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ghamza_backend_dev
    environment:
      DATABASE_URL: postgresql://ghamza_user:ghamza_password@postgres:5432/ghamza_shop
      DEBUG: "True"
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ALLOWED_ORIGINS: http://localhost:3005,http://frontend:3005
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ghamza_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # Next.js Frontend (Development mode with hot reload)
  frontend:
    image: node:18-alpine
    container_name: ghamza_frontend_dev
    working_dir: /app
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NODE_ENV: development
    ports:
      - "3005:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - ghamza_network
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

volumes:
  postgres_data_dev:

networks:
  ghamza_network:
    driver: bridge
